<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
:root {
  --brand: #1a3a5c;
  --brand-light: #2c5f8a;
  --accent: #f0a202;
  --bg: #f2f5f8;
  --card: #ffffff;
  --text: #1c2733;
  --muted: #6b7a8c;
  --line: #dde4ec;
  --danger: #c0392b;
  --ok: #1e8449;
  --radius: 12px;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: "Noto Sans TC", "Microsoft JhengHei", -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 16px;
  line-height: 1.6;
  -webkit-text-size-adjust: 100%;
}

/* ── 導覽列 ───────────────────────────── */
nav.topnav {
  background: #10263e;
  border-bottom: 1px solid rgba(255,255,255,.12);
}
.nav-inner {
  max-width: 1100px; margin: 0 auto;
  padding: 8px 14px;
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px; flex-wrap: wrap;
}
.nav-links { display: flex; gap: 4px; flex-wrap: wrap; }
.nav-link {
  color: #cfe0f0; text-decoration: none;
  padding: 8px 13px; border-radius: 8px;
  font-size: 14px; font-weight: 600; white-space: nowrap;
}
.nav-link:hover { background: rgba(255,255,255,.1); color: #fff; }
.nav-link.active { background: var(--brand-light); color: #fff; }

.nav-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.nav-user { color: #9fc0dd; font-size: 13px; white-space: nowrap; }
.nav-btn {
  display: inline-block; text-decoration: none;
  padding: 7px 13px; border-radius: 8px;
  font-size: 13px; font-weight: 600; white-space: nowrap;
  border: 1px solid rgba(255,255,255,.28);
  background: transparent; color: #dce9f5; font-family: inherit;
}
.nav-btn:hover { background: rgba(255,255,255,.12); }
.nav-btn.primary { background: var(--accent); border-color: var(--accent); color: #3a2800; }
.nav-btn.primary:hover { filter: brightness(1.08); }

@media (max-width: 560px) {
  .nav-inner { padding: 7px 10px; }
  .nav-link, .nav-btn { padding: 6px 10px; font-size: 13px; }
  .nav-user { width: 100%; }
}

/* ── 頁首 ─────────────────────────────── */
header.top {
  background: linear-gradient(135deg, var(--brand), var(--brand-light));
  color: #fff;
  padding: 22px 18px 18px;
}
header.top h1 { margin: 0 0 6px; font-size: 21px; letter-spacing: .5px; }
header.top p  { margin: 0; font-size: 14px; opacity: .9; }

.progress-wrap {
  position: sticky; top: 0; z-index: 50;
  background: var(--card);
  border-bottom: 1px solid var(--line);
  padding: 8px 18px;
}
.progress-bar { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
.progress-fill {
  height: 100%; width: 0%;
  background: linear-gradient(90deg, var(--brand-light), var(--accent));
  transition: width .3s ease;
}
.progress-text { font-size: 12px; color: var(--muted); margin-top: 4px; }

/* ── 版面 ─────────────────────────────── */
main { max-width: 860px; margin: 0 auto; padding: 16px 14px 120px; }

section.card {
  background: var(--card);
  border-radius: var(--radius);
  border: 1px solid var(--line);
  margin-bottom: 16px;
  overflow: hidden;
}
section.card > h2 {
  margin: 0;
  padding: 14px 16px;
  font-size: 17px;
  background: #f7f9fb;
  border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 9px;
}
section.card > h2 .num {
  background: var(--brand); color: #fff;
  width: 26px; height: 26px; border-radius: 50%;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 13px; flex: 0 0 auto;
}
.card-body { padding: 16px; }

.hint {
  font-size: 13px; color: var(--muted);
  background: #f7f9fb; border-left: 3px solid var(--brand-light);
  padding: 9px 12px; border-radius: 0 8px 8px 0; margin: 0 0 14px;
}
.hint.warn { border-left-color: var(--accent); background: #fff8e8; color: #7a5600; }

/* ── 欄位 ─────────────────────────────── */
.field { margin-bottom: 14px; }
.field > label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 5px; }
.field .sub { font-size: 12px; color: var(--muted); font-weight: 400; margin-left: 4px; }
.req::after { content: " *"; color: var(--danger); }

/* 用排除法而非逐一列舉輸入類型：先前漏掉 password 導致密碼欄套不到樣式，
   掉回瀏覽器預設寬度，跟旁邊的欄位對不齊。 */
input:not([type=checkbox]):not([type=radio]):not([type=file]),
select, textarea {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: 9px;
  font-size: 16px;           /* 16px 以下 iOS 會自動放大畫面 */
  font-family: inherit;
  background: #fff;
  color: var(--text);
}
input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: var(--brand-light);
  box-shadow: 0 0 0 3px rgba(44,95,138,.15);
}

/* 瀏覽器自動填入會蓋上黃/藍底色，跟隔壁欄位看起來不一致 */
input:-webkit-autofill,
input:-webkit-autofill:hover,
input:-webkit-autofill:focus {
  -webkit-box-shadow: 0 0 0 1000px #fff inset;
  -webkit-text-fill-color: var(--text);
  caret-color: var(--text);
}
textarea { resize: vertical; min-height: 78px; line-height: 1.6; }
input.invalid, select.invalid, textarea.invalid { border-color: var(--danger); background: #fff5f4; }

.readonly-box {
  padding: 10px 12px; background: #eef2f6; border-radius: 9px;
  color: var(--muted); font-size: 15px;
}

.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
@media (max-width: 620px) {
  .grid2, .grid3 { grid-template-columns: 1fr; }
  .grid3.keep { grid-template-columns: repeat(3, 1fr); }
}

/* ── 勾選 / 單選 ──────────────────────── */
.chk-group { display: flex; flex-wrap: wrap; gap: 8px; }
.chk-group label {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 12px; border: 1px solid var(--line); border-radius: 99px;
  background: #fff; font-size: 14px; cursor: pointer; user-select: none;
}
.chk-group label:has(input:checked) {
  border-color: var(--brand-light); background: #e8f0f7; font-weight: 600;
}
.chk-group input { width: 16px; height: 16px; accent-color: var(--brand); margin: 0; }

.radio-col label {
  display: flex; align-items: flex-start; gap: 8px;
  padding: 9px 11px; border: 1px solid var(--line); border-radius: 9px;
  margin-bottom: 7px; background: #fff; cursor: pointer; font-size: 15px;
}
.radio-col label:has(input:checked) { border-color: var(--brand-light); background: #e8f0f7; }
.radio-col input { accent-color: var(--brand); margin-top: 3px; }

/* ── 摺疊區 ───────────────────────────── */
details.fold {
  border: 1px solid var(--line); border-radius: 9px;
  margin-bottom: 14px; background: #fbfcfd;
}
details.fold > summary {
  padding: 11px 14px; cursor: pointer; font-weight: 600; font-size: 14px;
  list-style: none; display: flex; align-items: center; justify-content: space-between;
}
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary::after { content: "▾"; color: var(--muted); }
details.fold[open] > summary::after { content: "▴"; }
details.fold > div { padding: 0 14px 14px; }

/* ── 動態卡片 ─────────────────────────── */
.dyn-card {
  border: 1px solid var(--line); border-radius: var(--radius);
  margin-bottom: 14px; background: #fbfcfd; overflow: hidden;
}
.dyn-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 13px; background: #eef3f8; border-bottom: 1px solid var(--line);
}
.dyn-title { font-weight: 700; font-size: 15px; color: var(--brand); }
.dyn-body { padding: 13px; }

.sub-card {
  border: 1px dashed #c3cfdc; border-radius: 10px;
  padding: 12px; margin-bottom: 10px; background: #fff;
}
.sub-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 9px; font-weight: 600; font-size: 14px; color: var(--brand-light);
}

.sub-section-title {
  font-size: 14px; font-weight: 700; color: var(--brand);
  margin: 16px 0 8px; padding-top: 12px; border-top: 2px solid var(--line);
  display: flex; align-items: center; gap: 6px;
}

/* ── 按鈕 ─────────────────────────────── */
button { font-family: inherit; cursor: pointer; }

.btn-add {
  width: 100%; padding: 11px; font-size: 15px; font-weight: 600;
  border: 1.5px dashed var(--brand-light); border-radius: 10px;
  background: #fff; color: var(--brand-light);
}
.btn-add:hover { background: #eef3f8; }
.btn-add:disabled { opacity: .45; cursor: not-allowed; }

.btn-add.small { padding: 8px; font-size: 14px; }

.btn-del {
  border: none; background: transparent; color: var(--danger);
  font-size: 13px; padding: 4px 8px; border-radius: 6px;
}
.btn-del:hover { background: #fdecea; }

.btn-submit {
  width: 100%; padding: 16px; font-size: 18px; font-weight: 700;
  border: none; border-radius: 12px; color: #fff;
  background: linear-gradient(135deg, var(--brand), var(--brand-light));
  box-shadow: 0 4px 14px rgba(26,58,92,.28);
}
.btn-submit:disabled {
  background: #b9c4d0; box-shadow: none; cursor: not-allowed;
}

.btn-ghost {
  padding: 10px 14px; font-size: 14px; border-radius: 9px;
  border: 1px solid var(--line); background: #fff; color: var(--muted);
}

/* ── 相片 ─────────────────────────────── */
.file-drop {
  border: 1.5px dashed #c3cfdc; border-radius: 10px;
  padding: 14px; text-align: center; background: #fafbfc;
  font-size: 14px; color: var(--muted);
}
.file-drop input[type=file] { display: none; }
.file-drop .pick {
  display: inline-block; margin-top: 6px; padding: 8px 16px;
  background: var(--brand-light); color: #fff; border-radius: 8px;
  font-size: 14px; font-weight: 600;
}
.thumbs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.thumb { position: relative; width: 84px; }
.thumb img { width: 84px; height: 84px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); display: block; }
.thumb .x {
  position: absolute; top: -6px; right: -6px;
  width: 22px; height: 22px; border-radius: 50%;
  background: var(--danger); color: #fff; border: none;
  font-size: 13px; line-height: 1; display: flex; align-items: center; justify-content: center;
}
.thumb .sz { font-size: 11px; color: var(--muted); text-align: center; margin-top: 2px; }

/* ── 送出區 ───────────────────────────── */
.submit-area { padding: 4px 2px 0; }
.draft-row {
  display: flex; align-items: center; justify-content: space-between;
  gap: 10px; margin-bottom: 12px; font-size: 13px; color: var(--muted);
}

/* ── 遮罩 / 結果頁 ────────────────────── */
.overlay {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(20,30,42,.78);
  display: none; align-items: center; justify-content: center; padding: 20px;
}
.overlay.show { display: flex; }
.overlay-box {
  background: #fff; border-radius: 14px; padding: 26px 22px;
  max-width: 420px; width: 100%; text-align: center;
}
.spinner {
  width: 42px; height: 42px; margin: 0 auto 14px;
  border: 4px solid var(--line); border-top-color: var(--brand-light);
  border-radius: 50%; animation: spin 0.9s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.result-icon { font-size: 46px; line-height: 1; margin-bottom: 10px; }
.result-code {
  font-family: ui-monospace, Menlo, Consolas, monospace;
  font-size: 26px; font-weight: 700; letter-spacing: 3px; color: var(--brand);
  background: #eef3f8; padding: 10px; border-radius: 9px; margin: 12px 0;
}

.msg-box {
  padding: 12px 14px; border-radius: 9px; margin-bottom: 14px;
  font-size: 14px; display: none; white-space: pre-wrap;
}
.msg-box.err { display: block; background: #fdecea; color: var(--danger); border: 1px solid #f5c6c2; }
.msg-box.ok  { display: block; background: #eafaf1; color: var(--ok); border: 1px solid #b7e4c9; }

footer.bottom {
  text-align: center; font-size: 12px; color: var(--muted);
  padding: 20px 14px 30px;
}

/* ═══ 登入頁 ═══════════════════════════ */
.login-wrap { max-width: 440px; margin: 40px auto; padding: 0 14px; }
.tabs { display: flex; gap: 6px; margin-bottom: 16px; }
.tab {
  flex: 1; padding: 11px; text-align: center; cursor: pointer;
  border: 1px solid var(--line); border-radius: 10px; background: #fff;
  font-size: 15px; font-weight: 600; color: var(--muted); font-family: inherit;
}
.tab.active { background: var(--brand); color: #fff; border-color: var(--brand); }

/* ═══ 查詢頁 ═══════════════════════════ */
.filter-bar {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 10px; margin-bottom: 14px;
}
.stat-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.stat-chip {
  background: #fff; border: 1px solid var(--line); border-radius: 10px;
  padding: 9px 14px; font-size: 13px; color: var(--muted);
}
.stat-chip b { color: var(--brand); font-size: 19px; margin-right: 4px; }

.q-card {
  background: #fff; border: 1px solid var(--line); border-left: 4px solid var(--brand-light);
  border-radius: 10px; padding: 13px 15px; margin-bottom: 10px;
}
.q-card .q-meta {
  font-size: 12px; color: var(--muted); margin-bottom: 6px;
  display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
}
.q-card .q-text { font-size: 15px; font-weight: 600; line-height: 1.6; }
.q-card .q-extra {
  margin-top: 8px; font-size: 13px; color: #4a5a6a;
  background: #f7f9fb; padding: 8px 11px; border-radius: 7px; white-space: pre-wrap;
}
.tag {
  display: inline-block; background: #e8f0f7; color: var(--brand);
  padding: 2px 9px; border-radius: 99px; font-size: 11px; font-weight: 600;
}
.tag.gray { background: #eef1f4; color: var(--muted); }
.tag.ok { background: #eafaf1; color: var(--ok); }
.tag.warn { background: #fff8e8; color: #7a5600; }
.tag.err { background: #fdecea; color: var(--danger); }

.empty {
  text-align: center; padding: 40px 20px; color: var(--muted); font-size: 14px;
}

/* ═══ 教師後台 ═════════════════════════ */
.wide { max-width: 1100px; }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
table.data { border-collapse: collapse; width: 100%; font-size: 14px; min-width: 860px; }
table.data th, table.data td {
  padding: 9px 11px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top;
}
table.data th {
  background: #f2f6fa; font-size: 13px; color: var(--brand);
  position: sticky; top: 0; white-space: nowrap;
}
table.data tr:hover td { background: #fafcfe; }
table.data td.num { text-align: center; color: var(--muted); }

.btn-sm {
  padding: 5px 11px; font-size: 13px; border-radius: 7px;
  border: 1px solid var(--line); background: #fff; font-family: inherit;
  white-space: nowrap;
}
.btn-sm:hover { background: #eef3f8; }
.btn-sm.ok { border-color: var(--ok); color: var(--ok); }
.btn-sm.ok:hover { background: #eafaf1; }
.btn-sm.warn { border-color: var(--accent); color: #7a5600; }
.btn-sm.warn:hover { background: #fff8e8; }

.modal {
  position: fixed; inset: 0; z-index: 300; background: rgba(20,30,42,.75);
  display: none; align-items: flex-start; justify-content: center;
  padding: 24px 14px; overflow-y: auto;
}
.modal.show { display: flex; }
.modal-box {
  background: #fff; border-radius: 14px; max-width: 780px; width: 100%;
  padding: 22px; margin: auto 0;
}
.modal-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px solid var(--line);
}
.detail-sec { margin-bottom: 16px; }
.detail-sec h4 {
  margin: 0 0 7px; font-size: 14px; color: var(--brand);
  padding-bottom: 5px; border-bottom: 2px solid var(--line);
}
.kv { display: grid; grid-template-columns: 130px 1fr; gap: 5px 12px; font-size: 14px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; white-space: pre-wrap; word-break: break-word; }

/* 列表的操作欄：檢視與刪除並排，窄螢幕自動換行 */
.row-actions { display: flex; gap: 6px; flex-wrap: wrap; }

/* 刪除鈕做成線框紅字而非填色 —— 每一列都有，填色會讓整張表看起來很危險 */
.btn-sm.del-row { border-color: #f0c6c1; color: var(--danger); background: #fff; }
.btn-sm.del-row:hover { background: #fdecea; border-color: var(--danger); }

/* 刪除確認視窗 */
#delModal .modal-head { border-bottom-color: #f5ddda; }
#delModal code {
  background: #fdecea; padding: 2px 8px; border-radius: 5px;
  font-weight: 700; letter-spacing: 2px; color: var(--danger);
}
#delModal .hint.warn { line-height: 1.8; }

.btn-submit.danger {
  background: var(--danger); box-shadow: 0 4px 14px rgba(192,57,43,.28);
}
.btn-submit.danger:disabled {
  background: #b9c4d0; box-shadow: none; cursor: not-allowed;
}
</style>

</head>
<body>

<header class="top">
  <h1>教師後台</h1>
  <p id="hdr-sub">審核 · 檢視 · 匯出</p>
</header>

<main class="wide">

  <div id="msgBox" class="msg-box"></div>
  <div class="stat-row" id="statRow"></div>

  <section class="card">
    <h2><span class="num">🔍</span>篩選與匯出</h2>
    <div class="card-body">
      <div class="filter-bar">
        <div class="field" style="margin:0">
          <label>審核狀態</label>
          <select id="fStatus">
            <option value="">全部</option>
            <option value="待審">待審</option>
            <option value="通過">通過</option>
            <option value="退回修改">退回修改</option>
          </select>
        </div>
        <div class="field" style="margin:0">
          <label>畢業學年度</label>
          <select id="fYear"><option value="">全部年度</option></select>
        </div>
        <div class="field" style="margin:0">
          <label>關鍵字</label>
          <input type="text" id="fKw" placeholder="姓名、學校、Email…">
        </div>
      </div>

      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px">
        <select id="expSheet" style="width:auto;min-width:170px">
          <option value="Main">Main（基本資料＋心得）</option>
          <option value="Admissions">Admissions（推甄校系）</option>
          <option value="Interview">Interview（口試題目）</option>
          <option value="Practical">Practical（術科）</option>
          <option value="Files">Files（相片清單）</option>
        </select>
        <label class="nav-user" style="color:var(--muted);display:flex;align-items:center;gap:6px">
          <input type="checkbox" id="expApproved"> 只匯出已審核通過
        </label>
        <button type="button" class="btn-ghost" id="btnExport">⬇ 匯出 CSV</button>
        <button type="button" class="btn-ghost" id="btnReload">↻ 重新整理</button>
      </div>
    </div>
  </section>

  <div class="table-wrap">
    <table class="data">
      <thead>
        <tr>
          <th>編號</th><th>學年度</th><th>姓名</th><th>班級</th>
          <th>最終落點</th><th>公開層級</th>
          <th>校系</th><th>口試</th><th>術科</th><th>相片</th>
          <th>狀態</th><th>操作</th>
        </tr>
      </thead>
      <tbody id="tbody">
        <tr><td colspan="12" class="empty">載入中…</td></tr>
      </tbody>
    </table>
  </div>

</main>

<footer class="bottom">
  國立霧峰高級農工職業學校　電子科　畢業生升學資料蒐集系統
</footer>

<!-- 詳細內容 -->
<div class="modal" id="modal">
  <div class="modal-box">
    <div class="modal-head">
      <h3 style="margin:0;font-size:18px" id="mTitle">詳細資料</h3>
      <button type="button" class="btn-ghost" onclick="closeModal()">關閉</button>
    </div>
    <div id="mBody"></div>
    <div style="border-top:1px solid var(--line);padding-top:14px;margin-top:14px">
      <div class="field">
        <label>審核意見<span class="sub">退回修改時會一併寄給學生</span></label>
        <textarea id="mNote" rows="3" placeholder="例：口試題目部分請補充第二個志願的內容"></textarea>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">

/**
 * 產生可選的畢業學年度清單（民國制）。
 *
 * 關鍵是「目前學年度」不等於「最近一個已畢業的學年度」：
 *   115 學年度 = 2026-08 ～ 2027-07，這批學生 2027 年 6 月才畢業。
 *   所以 2026 年 8 月的當下，最新的畢業生是 114 學年度，
 *   把 115 列進去會讓還沒畢業的學年度出現在選單裡。
 *
 * 判斷方式：先算出目前學年度，若「該學年度的 6 月」還沒到，就退一年。
 */
function getGradYears_() {
  // 需要提前開放尚未畢業的那一屆填寫時，
  // 把 CONFIG.GRAD_YEAR_LATEST 設成該學年度（例如 '115'）即可覆寫自動判斷。
  const override = String(CONFIG.GRAD_YEAR_LATEST || '').trim();

  let latest;
  if (override) {
    latest = parseInt(override, 10);
  } else {
    const now = new Date();
    const month = now.getMonth() + 1;

    let academic = now.getFullYear() - 1911;
    if (month < 8) academic -= 1;          // 1~7 月仍屬前一學年度

    latest = academic;
    if (month >= 8 || month < 6) latest -= 1;   // 該學年度的 6 月還沒到 = 還沒畢業
  }

  const years = [];
  for (let i = 0; i < CONFIG.GRAD_YEAR_COUNT; i++) years.push(String(latest - i));
  return years;
}

    school: CONFIG.SCHOOL,

    maxFilesPerPractical: CONFIG.MAX_FILES_PER_PRACTICAL,
    maxFilesTotal: CONFIG.MAX_FILES_TOTAL,
    maxTotalBytes: CONFIG.MAX_TOTAL_BYTES,
    imageMaxEdge: CONFIG.IMAGE_MAX_EDGE,
    imageQuality: CONFIG.IMAGE_QUALITY,
    lockAfterApproved: CONFIG.LOCK_AFTER_APPROVED,
    options: OPTIONS
  };
}

<script>
/* ═══════════════════════════════════════════════════════════
   common.html — 各頁共用：執行模式、API client、session、導覽列
   ═══════════════════════════════════════════════════════════ */

const SESS_KEY = 'wufai_ee_session_v1';

/**
 * 執行模式：
 *   gas  — Apps Script 託管，用 google.script.run
 *   api  — 靜態託管且 config.js 已填 /exec 網址，用 fetch + doPost
 *   demo — 靜態託管但沒填網址，不連後端
 */
function runMode() {
  if (typeof google !== 'undefined' && google.script && google.script.run) return 'gas';
  if (window.GRAD_API_URL && String(window.GRAD_API_URL).trim()) return 'api';
  return 'demo';
}

/** 產生指向其他頁的網址，兩種託管方式的路徑規則不同 */
function pageUrl(page) {
  if (runMode() === 'gas') {
    const base = (typeof GAS_BASE_URL !== 'undefined' && GAS_BASE_URL) ? GAS_BASE_URL : '';
    return base + (page === 'index' ? '' : '?page=' + page);
  }
  return page === 'index' ? 'index.html' : page + '.html';
}

/**
 * 呼叫後端。回傳 Promise<回應物件>。
 * demo 模式一律回傳固定訊息，不會有網路請求。
 */
function api(action, params) {
  const body = Object.assign({ action: action }, params || {});
  const mode = runMode();

  if (mode === 'demo') {
    return Promise.resolve({
      ok: false,
      demo: true,
      message: '目前是介面示範模式，未連接後端資料庫。'
    });
  }

  if (mode === 'gas') {
    // 注意：不能直接叫 routeApi_，Apps Script 的底線結尾函式是私有的、前端叫不到
    return new Promise(function (resolve, reject) {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(reject)
        .apiCall(body);
    });
  }

  // text/plain 讓瀏覽器視為簡單請求，避開 Apps Script 無法回應的 CORS preflight
  return fetch(String(window.GRAD_API_URL).trim(), {
    method: 'POST',
    redirect: 'follow',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(body)
  })
    .then(function (r) { return r.text(); })
    .then(function (txt) {
      try {
        return JSON.parse(txt);
      } catch (e) {
        throw new Error('伺服器回應格式不正確，通常代表 Apps Script 未正確部署，' +
                        '或「誰可以存取」沒有設成「所有人」。');
      }
    });
}


/* ── session（存在 sessionStorage，關掉分頁就失效）────────── */

function getSession() {
  try {
    const raw = sessionStorage.getItem(SESS_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) {
    return null;
  }
}

function setSession(s) {
  try { sessionStorage.setItem(SESS_KEY, JSON.stringify(s)); } catch (e) {}
}

function clearSession() {
  try { sessionStorage.removeItem(SESS_KEY); } catch (e) {}
}

function logout() {
  const s = getSession();
  if (s && s.token) { try { api('logout', { token: s.token }); } catch (e) {} }
  clearSession();
  location.href = pageUrl('index');
}


/* ── 導覽列 ──────────────────────────────────────────────── */

/**
 * 在 <body> 最前面插入導覽列。
 * @param {string} active 目前頁面代碼，用來標示高亮
 */
function renderNav(active) {
  const s = getSession();
  const nav = document.createElement('nav');
  nav.className = 'topnav';

  const items = [
    { key: 'index',  label: '📝 填寫表單',   href: pageUrl('index') },
    { key: 'browse', label: '🔍 歷屆經驗查詢', href: pageUrl('browse') }
  ];

  let right = '';
  if (s && s.role === 'teacher') {
    items.push({ key: 'admin', label: '🗂️ 教師後台', href: pageUrl('admin') });
    right = '<span class="nav-user">👩‍🏫 ' + escapeHtml(s.label || '教師') + '</span>' +
            '<button type="button" class="nav-btn" onclick="logout()">登出</button>';
  } else if (s && s.role === 'student') {
    items.push({ key: 'edit', label: '✏️ 修改我的資料', href: pageUrl('index') + (runMode() === 'gas' ? '&' : '?') + 'mode=edit' });
    right = '<span class="nav-user">🎓 ' + escapeHtml(s.label || '') + '</span>' +
            '<button type="button" class="nav-btn" onclick="logout()">登出</button>';
  } else {
    right = '<a class="nav-btn" href="' + pageUrl('login') + '?role=student">畢業生登入修改</a>' +
            '<a class="nav-btn primary" href="' + pageUrl('login') + '?role=teacher">教師登入審核</a>';
  }

  nav.innerHTML =
    '<div class="nav-inner">' +
      '<div class="nav-links">' +
        items.map(function (it) {
          return '<a href="' + it.href + '" class="nav-link' +
                 (it.key === active ? ' active' : '') + '">' + it.label + '</a>';
        }).join('') +
      '</div>' +
      '<div class="nav-right">' + right + '</div>' +
    '</div>';

  document.body.insertBefore(nav, document.body.firstChild);
}

function escapeHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

/** 讀取網址參數 */
function qs(name) {
  const m = new RegExp('[?&]' + name + '=([^&#]*)').exec(location.search);
  return m ? decodeURIComponent(m[1].replace(/\+/g, ' ')) : '';
}

/** 統一的錯誤訊息呈現 */
function showBanner(container, text, kind) {
  const el = typeof container === 'string' ? document.querySelector(container) : container;
  if (!el) return;
  el.textContent = text;
  el.className = 'msg-box ' + (kind || 'err');
}
</script>

<script>
let LIST = [];
let CURRENT = null;

document.addEventListener('DOMContentLoaded', function () {
  renderNav('admin');

  const s = getSession();
  if (!s || s.role !== 'teacher') {
    location.href = pageUrl('login') + '?role=teacher';
    return;
  }
  document.getElementById('hdr-sub').textContent = '審核 · 檢視 · 匯出　|　' + (s.label || '');

  ['fStatus', 'fYear'].forEach(function (id) {
    document.getElementById(id).onchange = renderTable;
  });
  let t = null;
  document.getElementById('fKw').oninput = function () {
    clearTimeout(t); t = setTimeout(renderTable, 200);
  };
  // 不能直接指定 load，否則事件物件會被當成 keepBanner 傳進去（truthy）
  document.getElementById('btnReload').onclick = function () { load(); };
  document.getElementById('btnExport').onclick = doExport;
  bindDelete();

  load();
});

function busy(on, text) {
  document.getElementById('ovText').textContent = text || '載入中…';
  document.getElementById('overlay').classList.toggle('show', !!on);
}

function token() { const s = getSession(); return s ? s.token : ''; }

/** session 逾時就導回登入頁 */
function handleAuthFail(res) {
  if (res && !res.ok && /登入已逾時|權限不足/.test(res.message || '')) {
    clearSession();
    location.href = pageUrl('login') + '?role=teacher';
    return true;
  }
  return false;
}

/**
 * 重新載入列表。
 * @param {boolean} keepBanner 保留現有訊息 —— 審核／刪除成功後會接著呼叫 load()，
 *        若這裡把訊息框清掉，剛顯示的成功訊息會立刻變成隱藏，老師等於沒有回饋。
 */
function load(keepBanner) {
  busy(true);
  api('adminList', { token: token() })
    .then(function (res) {
      busy(false);
      if (handleAuthFail(res)) return;
      if (!res.ok) { showBanner('#msgBox', res.message || '載入失敗。'); return; }
      LIST = res.list;
      if (!keepBanner) document.getElementById('msgBox').className = 'msg-box';
      renderStat(res.stat);
      buildYearFilter();
      renderTable();
    })
    .catch(function (e) {
      busy(false);
      showBanner('#msgBox', '連線失敗：' + (e && e.message ? e.message : e));
    });
}

function renderStat(st) {
  document.getElementById('statRow').innerHTML =
    '<div class="stat-chip"><b>' + st.total + '</b>總筆數</div>' +
    '<div class="stat-chip"><b>' + st.pending + '</b>待審</div>' +
    '<div class="stat-chip"><b>' + st.approved + '</b>已通過</div>' +
    '<div class="stat-chip"><b>' + st.returned + '</b>已退回</div>';
}

function buildYearFilter() {
  const years = Array.from(new Set(LIST.map(function (x) { return x.gradYear; })))
    .filter(Boolean).sort().reverse();
  const el = document.getElementById('fYear');
  const keep = el.value;
  el.innerHTML = '<option value="">全部年度</option>';
  years.forEach(function (y) {
    const o = document.createElement('option');
    o.value = y; o.textContent = y + ' 學年度';
    el.appendChild(o);
  });
  el.value = keep;
}

function statusTag(st) {
  const cls = st === '通過' ? 'ok' : (st === '退回修改' ? 'err' : 'warn');
  return '<span class="tag ' + cls + '">' + escapeHtml(st) + '</span>';
}

function renderTable() {
  const fs = document.getElementById('fStatus').value;
  const fy = document.getElementById('fYear').value;
  const kw = document.getElementById('fKw').value.trim().toLowerCase();

  const rows = LIST.filter(function (x) {
    if (fs && x.reviewStatus !== fs) return false;
    if (fy && x.gradYear !== fy) return false;
    if (kw) {
      const hay = [x.name, x.email, x.currentPlace, x.className, x.code].join(' ').toLowerCase();
      if (hay.indexOf(kw) < 0) return false;
    }
    return true;
  });

  const tb = document.getElementById('tbody');
  if (!rows.length) {
    tb.innerHTML = '<tr><td colspan="12" class="empty">沒有符合條件的資料</td></tr>';
    return;
  }

  tb.innerHTML = rows.map(function (x) {
    // 「不公開」選項雖已下架，舊資料仍可能是這個值，這裡要顯示得出來
    const anon = x.publishLevel.indexOf('匿名') === 0 ? 'gray'
               : (x.publishLevel.indexOf('僅供校內') === 0 ? 'err' : 'ok');
    const shortLevel = x.publishLevel.indexOf('完全公開') === 0 ? '公開'
                     : (x.publishLevel.indexOf('匿名') === 0 ? '匿名' : '不公開');
    return '<tr>' +
      '<td><code>' + escapeHtml(x.code) + '</code></td>' +
      '<td class="num">' + escapeHtml(x.gradYear) + '</td>' +
      '<td><strong>' + escapeHtml(x.name) + '</strong></td>' +
      '<td>' + escapeHtml(x.className) + '</td>' +
      '<td>' + escapeHtml(x.currentPlace) + '</td>' +
      '<td><span class="tag ' + anon + '">' + shortLevel + '</span></td>' +
      '<td class="num">' + x.counts.adm + '</td>' +
      '<td class="num">' + x.counts.itv + '</td>' +
      '<td class="num">' + x.counts.prc + '</td>' +
      '<td class="num">' + x.counts.file + '</td>' +
      '<td>' + statusTag(x.reviewStatus) +
        (x.reviewNote ? '<div style="font-size:11px;color:var(--muted);margin-top:3px">' +
          escapeHtml(x.reviewNote.slice(0, 30)) + '</div>' : '') + '</td>' +
      '<td><div class="row-actions">' +
        '<button type="button" class="btn-sm" onclick="openDetail(\'' +
          escapeHtml(x.submissionId) + '\')">檢視／審核</button>' +
        '<button type="button" class="btn-sm del-row" title="刪除這筆資料" ' +
          'onclick="openDelete(\'' + escapeHtml(x.submissionId) + '\')">🗑️ 刪除</button>' +
      '</div></td>' +
    '</tr>';
  }).join('');
}


/* ── 詳細內容 ─────────────────────────── */

function openDetail(submissionId) {
  busy(true, '載入詳細資料…');
  api('adminDetail', { token: token(), submissionId: submissionId })
    .then(function (res) {
      busy(false);
      if (handleAuthFail(res)) return;
      if (!res.ok) { alert(res.message || '載入失敗'); return; }
      CURRENT = LIST.filter(function (x) { return x.submissionId === submissionId; })[0];
      renderDetail(res.record);
      document.getElementById('mNote').value = CURRENT ? CURRENT.reviewNote : '';
      document.getElementById('modal').classList.add('show');
    })
    .catch(function (e) { busy(false); alert('連線失敗：' + e); });
}

function closeModal() {
  document.getElementById('modal').classList.remove('show');
  CURRENT = null;
}


/* ── 刪除 ─────────────────────────────── */
/* 列表的「🗑️ 刪除」與詳細視窗的刪除按鈕，走的是同一個確認視窗 */

let DEL_TARGET = null;

function bindDelete() {
  const input = document.getElementById('delConfirm');
  const btn = document.getElementById('btnDelete');

  input.oninput = function () {
    const want = DEL_TARGET ? DEL_TARGET.code.toUpperCase() : '';
    btn.disabled = input.value.trim().toUpperCase() !== want;
  };
  input.onkeydown = function (e) {
    if (e.key === 'Enter' && !btn.disabled) doDelete();
  };
  btn.onclick = doDelete;

  document.getElementById('btnOpenDelete').onclick = function () {
    const id = CURRENT ? CURRENT.submissionId : null;
    closeModal();
    if (id) openDelete(id);
  };
}

function openDelete(submissionId) {
  const rec = LIST.filter(function (x) { return x.submissionId === submissionId; })[0];
  if (!rec) { alert('找不到這筆資料，請先按「重新整理」。'); return; }
  DEL_TARGET = rec;

  document.getElementById('delSummary').innerHTML =
    '<strong>' + escapeHtml(rec.name) + '</strong>（' + escapeHtml(rec.gradYear) +
    ' 學年度 · 編號 ' + escapeHtml(rec.code) + '）<br>' +
    '校系 ' + rec.counts.adm + ' 筆　口試 ' + rec.counts.itv + ' 題　術科 ' +
    rec.counts.prc + ' 項　相片 ' + rec.counts.file + ' 張' +
    (rec.reviewStatus === '通過' ? '<br>⚠️ 這筆<strong>已審核通過</strong>，刪除前請再確認。' : '');

  document.getElementById('delCode').textContent = rec.code;
  document.getElementById('delConfirm').value = '';
  document.getElementById('btnDelete').disabled = true;
  document.getElementById('delModal').classList.add('show');
  setTimeout(function () { document.getElementById('delConfirm').focus(); }, 50);
}

function closeDelModal() {
  document.getElementById('delModal').classList.remove('show');
  document.getElementById('delConfirm').value = '';
  document.getElementById('btnDelete').disabled = true;
  DEL_TARGET = null;
}

function doDelete() {
  if (!DEL_TARGET) return;
  const code = document.getElementById('delConfirm').value.trim().toUpperCase();

  if (!confirm('最後確認：即將刪除「' + DEL_TARGET.name + '」（編號 ' + DEL_TARGET.code +
               '）的所有資料。\n\n五張分頁的對應列都會被刪除，此操作無法從網頁復原。\n\n確定要刪除嗎？')) {
    return;
  }

  busy(true, '刪除中…');
  api('adminDelete', {
    token: token(), submissionId: DEL_TARGET.submissionId, confirmCode: code
  })
    .then(function (res) {
      busy(false);
      if (handleAuthFail(res)) return;
      if (!res.ok) { alert(res.message || '刪除失敗'); return; }
      closeDelModal();
      showBanner('#msgBox', res.message, 'ok');
      load(true);
    })
    .catch(function (e) { busy(false); alert('連線失敗：' + e); });
}

function kv(pairs) {
  return '<dl class="kv">' + pairs.filter(function (p) {
    return String(p[1] || '').trim() !== '';
  }).map(function (p) {
    return '<dt>' + escapeHtml(p[0]) + '</dt><dd>' + escapeHtml(p[1]) + '</dd>';
  }).join('') + '</dl>';
}

function renderDetail(rec) {
  const m = rec.main;
  document.getElementById('mTitle').textContent =
    m.name + '（' + m.grad_year + ' 學年度 · 編號 ' +
    String(m.submission_id).substring(0, 6).toUpperCase() + '）';

  let html = '';

  html += '<div class="detail-sec"><h4>基本資料</h4>' + kv([
    ['班級座號', (m.class_name || '') + ' ' + (m.seat_no || '')],
    ['Email', m.email], ['手機', m.phone], ['IG/Line', m.social_id],
    ['最終落點', m.current_place], ['主要出路', m.main_path],
    ['報考群類', m.exam_group],
    ['統測總分', m.tve_total], ['班排', m.rank_pct],
    ['證照', (m.certificates || []).join('、')],
    ['競賽/專題', m.experiences], ['幹部社團', m.activities],
    ['公開層級', m.publish_level],
    ['願意回校分享', m.willing_share ? '是' : ''],
    ['接受提問', m.willing_qa ? '是' : '']
  ]) + '</div>';

  (rec.admissions || []).forEach(function (a, i) {
    html += '<div class="detail-sec"><h4>志願 ' + (i + 1) + '：' +
      escapeHtml(a.univ + ' ' + a.major) + (a.is_enrolled ? '　★最終就讀' : '') + '</h4>' +
      kv([
        ['招生管道', a.channel], ['一階', a.stage1_result],
        ['二階項目', (a.stage2_items || []).join('、')],
        ['二階成績', a.stage2_score],
        ['結果', String(a.final_result || '') + String(a.result_rank || '')],
        ['面試形式', a.itv_format], ['教授人數', a.itv_prof_count],
        ['時間', a.itv_duration_min], ['流程', a.itv_flow]
      ]);

    if ((a.interviews || []).length) {
      html += '<div style="margin-top:8px"><b style="font-size:13px">口試題目 ' +
        a.interviews.length + ' 題</b>';
      a.interviews.forEach(function (q, qi) {
        html += '<div class="q-card" style="margin:6px 0">' +
          '<div class="q-meta">' + (q.categories || []).map(function (c) {
            return '<span class="tag warn">' + escapeHtml(c) + '</span>';
          }).join('') + (q.difficulty ? '<span>難度 ' + escapeHtml(q.difficulty) + '</span>' : '') + '</div>' +
          '<div class="q-text">' + (qi + 1) + '. ' + escapeHtml(q.question) + '</div>' +
          (q.my_answer ? '<div class="q-extra"><b>當時回答：</b>' + escapeHtml(q.my_answer) + '</div>' : '') +
          (q.better_answer ? '<div class="q-extra"><b>回頭看：</b>' + escapeHtml(q.better_answer) + '</div>' : '') +
          (q.tip ? '<div class="q-extra"><b>提醒：</b>' + escapeHtml(q.tip) + '</div>' : '') +
        '</div>';
      });
      html += '</div>';
    }

    (a.practicals || []).forEach(function (p) {
      html += '<div class="q-card" style="margin:6px 0">' +
        '<div class="q-meta"><span class="tag">' + escapeHtml(p.subject || '術科') + '</span>' +
        (p.duration_min ? '<span>' + escapeHtml(p.duration_min) + ' 分</span>' : '') + '</div>' +
        '<div class="q-text">' + escapeHtml(p.content) + '</div>' +
        (p.equipment ? '<div class="q-extra"><b>設備：</b>' + escapeHtml(p.equipment) + '</div>' : '') +
        (p.prep_advice ? '<div class="q-extra"><b>建議：</b>' + escapeHtml(p.prep_advice) + '</div>' : '') +
        ((p.existingFiles || []).length ? '<div class="q-extra"><b>相片：</b>' +
          p.existingFiles.map(function (f) {
            return '<a href="' + escapeHtml(f.url) + '" target="_blank" rel="noopener">' +
                   escapeHtml(f.name) + '</a>';
          }).join('　') + '</div>' : '') +
      '</div>';
    });

    html += '</div>';
  });

  html += '<div class="detail-sec"><h4>備審與心得</h4>' + kv([
    ['備審頁數', m.portfolio_pages], ['製作工具', m.portfolio_tool],
    ['花費時數', m.portfolio_hours], ['備審重點', m.portfolio_focus],
    ['面試問到備審', m.portfolio_asked],
    ['整體心得', m.reflection],
    ['建議1', m.advice_1], ['建議2', m.advice_2], ['建議3', m.advice_3],
    ['高一高二', m.do_earlier], ['最後悔', m.regret]
  ]) + '</div>';

  document.getElementById('mBody').innerHTML = html;
}

function doReview(status) {
  if (!CURRENT) return;
  const note = document.getElementById('mNote').value.trim();

  if (status === '退回修改' && !note) {
    alert('退回修改請填寫審核意見，學生才知道要改什麼（這段文字會寄給他）。');
    return;
  }
  if (status === '通過' &&
      !confirm('審核通過後，這位畢業生就無法再自行修改資料了。確定要通過嗎？')) {
    return;
  }

  busy(true, '儲存審核結果…');
  api('adminReview', {
    token: token(), submissionId: CURRENT.submissionId, status: status, note: note
  })
    .then(function (res) {
      busy(false);
      if (handleAuthFail(res)) return;
      if (!res.ok) { alert(res.message || '審核失敗'); return; }
      closeModal();
      showBanner('#msgBox', res.message, 'ok');
      load(true);
    })
    .catch(function (e) { busy(false); alert('連線失敗：' + e); });
}


/* ── 匯出 ─────────────────────────────── */

function doExport() {
  const sheet = document.getElementById('expSheet').value;
  const onlyApproved = document.getElementById('expApproved').checked;

  busy(true, '產生 CSV…');
  api('adminExport', { token: token(), sheet: sheet, onlyApproved: onlyApproved })
    .then(function (res) {
      busy(false);
      if (handleAuthFail(res)) return;
      if (!res.ok) { alert(res.message || '匯出失敗'); return; }

      const blob = new Blob([res.csv], { type: 'text/csv;charset=utf-8;' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = res.filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);

      showBanner('#msgBox', '已匯出 ' + res.rowCount + ' 筆到 ' + res.filename, 'ok');
    })
    .catch(function (e) { busy(false); alert('連線失敗：' + e); });
}
</script>

</body>
