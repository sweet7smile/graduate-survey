<script>
let LIST = [];
let CURRENT = null;

document.addEventListener('DOMContentLoaded', function () {
  renderNav('admin');

  const s = getSession();
  if (!s || s.role !== 'teacher') {
    location.href = pageUrl('login') + '?role=teacher';
    return;
  }
  document.getElementById('hdr-sub').textContent = '審核 · 檢視 · 匯出　|　' + (s.label || '');

  ['fStatus', 'fYear'].forEach(function (id) {
    document.getElementById(id).onchange = renderTable;
  });
  let t = null;
  document.getElementById('fKw').oninput = function () {
    clearTimeout(t); t = setTimeout(renderTable, 200);
  };
  // 不能直接指定 load，否則事件物件會被當成 keepBanner 傳進去（truthy）
  document.getElementById('btnReload').onclick = function () { load(); };
  document.getElementById('btnExport').onclick = doExport;
  document.getElementById('btnEditHistory').onclick = openEditHistory;
  bindDelete();
  bindEditableFields();

  load();
});

function busy(on, text) {
  document.getElementById('ovText').textContent = text || '載入中…';
  document.getElementById('overlay').classList.toggle('show', !!on);
}

function token() { const s = getSession(); return s ? s.token : ''; }

/** session 逾時就導回登入頁 */
function handleAuthFail(res) {
  if (res && !res.ok && /登入已逾時|權限不足/.test(res.message || '')) {
    clearSession();
    location.href = pageUrl('login') + '?role=teacher';
    return true;
  }
  return false;
}

/**
 * 重新載入列表。
 * @param {boolean} keepBanner 保留現有訊息 —— 審核／刪除成功後會接著呼叫 load()，
 *        若這裡把訊息框清掉，剛顯示的成功訊息會立刻變成隱藏，老師等於沒有回饋。
 */
function load(keepBanner) {
  busy(true);
  api('adminList', { token: token() })
    .then(function (res) {
      busy(false);
      if (handleAuthFail(res)) return;
      if (!res.ok) { showBanner('#msgBox', res.message || '載入失敗。'); return; }
      LIST = res.list;
      if (!keepBanner) document.getElementById('msgBox').className = 'msg-box';
      renderStat(res.stat);
      buildYearFilter();
      renderTable();
    })
    .catch(function (e) {
      busy(false);
      showBanner('#msgBox', '連線失敗：' + (e && e.message ? e.message : e));
    });
}

function renderStat(st) {
  document.getElementById('statRow').innerHTML =
    '<div class="stat-chip"><b>' + st.total + '</b>總筆數</div>' +
    '<div class="stat-chip"><b>' + st.pending + '</b>待審</div>' +
    '<div class="stat-chip"><b>' + st.approved + '</b>已通過</div>' +
    '<div class="stat-chip"><b>' + st.returned + '</b>已退回</div>';
}

function buildYearFilter() {
  const years = Array.from(new Set(LIST.map(function (x) { return x.gradYear; })))
    .filter(Boolean).sort().reverse();
  const el = document.getElementById('fYear');
  const keep = el.value;
  el.innerHTML = '<option value="">全部年度</option>';
  years.forEach(function (y) {
    const o = document.createElement('option');
    o.value = y; o.textContent = y + ' 學年度';
    el.appendChild(o);
  });
  el.value = keep;
}

function statusTag(st) {
  const cls = st === '通過' ? 'ok' : (st === '退回修改' ? 'err' : 'warn');
  return '<span class="tag ' + cls + '">' + escapeHtml(st) + '</span>';
}

function renderTable() {
  const fs = document.getElementById('fStatus').value;
  const fy = document.getElementById('fYear').value;
  const kw = document.getElementById('fKw').value.trim().toLowerCase();

  const rows = LIST.filter(function (x) {
    if (fs && x.reviewStatus !== fs) return false;
    if (fy && x.gradYear !== fy) return false;
    if (kw) {
      const hay = [x.name, x.email, x.currentPlace, x.className, x.code].join(' ').toLowerCase();
      if (hay.indexOf(kw) < 0) return false;
    }
    return true;
  });

  const tb = document.getElementById('tbody');
  if (!rows.length) {
    tb.innerHTML = '<tr><td colspan="12" class="empty">沒有符合條件的資料</td></tr>';
    return;
  }

  tb.innerHTML = rows.map(function (x) {
    // 「不公開」選項雖已下架，舊資料仍可能是這個值，這裡要顯示得出來
    const anon = x.publishLevel.indexOf('匿名') === 0 ? 'gray'
               : (x.publishLevel.indexOf('僅供校內') === 0 ? 'err' : 'ok');
    const shortLevel = x.publishLevel.indexOf('完全公開') === 0 ? '公開'
                     : (x.publishLevel.indexOf('匿名') === 0 ? '匿名' : '不公開');
    return '<tr>' +
      '<td><code>' + escapeHtml(x.code) + '</code></td>' +
      '<td class="num">' + escapeHtml(x.gradYear) + '</td>' +
      '<td><strong>' + escapeHtml(x.name) + '</strong></td>' +
      '<td>' + escapeHtml(x.className) + '</td>' +
      '<td>' + escapeHtml(x.currentPlace) + '</td>' +
      '<td><span class="tag ' + anon + '">' + shortLevel + '</span></td>' +
      '<td class="num">' + x.counts.adm + '</td>' +
      '<td class="num">' + x.counts.itv + '</td>' +
      '<td class="num">' + x.counts.prc + '</td>' +
      '<td class="num">' + x.counts.file + '</td>' +
      '<td>' + statusTag(x.reviewStatus) +
        // 只有「退回修改」狀態才顯示備註——避免舊資料裡殘留的退件意見，
        // 顯示在「通過」狀態旁邊造成誤解（例如「通過」下面掛著「退回」字樣）
        (x.reviewStatus === '退回修改' && x.reviewNote ?
          '<div style="font-size:11px;color:var(--muted);margin-top:3px">' +
          escapeHtml(x.reviewNote.slice(0, 30)) + '</div>' : '') + '</td>' +
      '<td><div class="row-actions">' +
        '<button type="button" class="btn-sm" onclick="openDetail(\'' +
          escapeHtml(x.submissionId) + '\')">檢視／審核</button>' +
        '<button type="button" class="btn-sm del-row" title="刪除這筆資料" ' +
          'onclick="openDelete(\'' + escapeHtml(x.submissionId) + '\')">🗑️ 刪除</button>' +
      '</div></td>' +
    '</tr>';
  }).join('');
}


/* ── 詳細內容 ─────────────────────────── */

function openDetail(submissionId) {
  busy(true, '載入詳細資料…');
  api('adminDetail', { token: token(), submissionId: submissionId })
    .then(function (res) {
      busy(false);
      if (handleAuthFail(res)) return;
      if (!res.ok) { alert(res.message || '載入失敗'); return; }
      CURRENT = LIST.filter(function (x) { return x.submissionId === submissionId; })[0];
      renderDetail(res.record);
      document.getElementById('mNote').value = CURRENT ? CURRENT.reviewNote : '';
      document.getElementById('modal').classList.add('show');
    })
    .catch(function (e) { busy(false); alert('連線失敗：' + e); });
}

function closeModal() {
  document.getElementById('modal').classList.remove('show');
  CURRENT = null;
}


/* ── 刪除 ─────────────────────────────── */
/* 列表的「🗑️ 刪除」與詳細視窗的刪除按鈕，走的是同一個確認視窗 */

let DEL_TARGET = null;

function bindDelete() {
  const input = document.getElementById('delConfirm');
  const btn = document.getElementById('btnDelete');

  input.oninput = function () {
    const want = DEL_TARGET ? DEL_TARGET.code.toUpperCase() : '';
    btn.disabled = input.value.trim().toUpperCase() !== want;
  };
  input.onkeydown = function (e) {
    if (e.key === 'Enter' && !btn.disabled) doDelete();
  };
  btn.onclick = doDelete;

  document.getElementById('btnOpenDelete').onclick = function () {
    const id = CURRENT ? CURRENT.submissionId : null;
    closeModal();
    if (id) openDelete(id);
  };
}

function openDelete(submissionId) {
  const rec = LIST.filter(function (x) { return x.submissionId === submissionId; })[0];
  if (!rec) { alert('找不到這筆資料，請先按「重新整理」。'); return; }
  DEL_TARGET = rec;

  document.getElementById('delSummary').innerHTML =
    '<strong>' + escapeHtml(rec.name) + '</strong>（' + escapeHtml(rec.gradYear) +
    ' 學年度 · 編號 ' + escapeHtml(rec.code) + '）<br>' +
    '校系 ' + rec.counts.adm + ' 筆　口試 ' + rec.counts.itv + ' 題　術科 ' +
    rec.counts.prc + ' 項　相片 ' + rec.counts.file + ' 張' +
    (rec.reviewStatus === '通過' ? '<br>⚠️ 這筆<strong>已審核通過</strong>，刪除前請再確認。' : '');

  document.getElementById('delCode').textContent = rec.code;
  document.getElementById('delConfirm').value = '';
  document.getElementById('btnDelete').disabled = true;
  document.getElementById('delModal').classList.add('show');
  setTimeout(function () { document.getElementById('delConfirm').focus(); }, 50);
}

function closeDelModal() {
  document.getElementById('delModal').classList.remove('show');
  document.getElementById('delConfirm').value = '';
  document.getElementById('btnDelete').disabled = true;
  DEL_TARGET = null;
}

function doDelete() {
  if (!DEL_TARGET) return;
  const code = document.getElementById('delConfirm').value.trim().toUpperCase();

  if (!confirm('最後確認：即將刪除「' + DEL_TARGET.name + '」（編號 ' + DEL_TARGET.code +
               '）的所有資料。\n\n五張分頁的對應列都會被刪除，此操作無法從網頁復原。\n\n確定要刪除嗎？')) {
    return;
  }

  busy(true, '刪除中…');
  api('adminDelete', {
    token: token(), submissionId: DEL_TARGET.submissionId, confirmCode: code
  })
    .then(function (res) {
      busy(false);
      if (handleAuthFail(res)) return;
      if (!res.ok) { alert(res.message || '刪除失敗'); return; }
      closeDelModal();
      showBanner('#msgBox', res.message, 'ok');
      load(true);
    })
    .catch(function (e) { busy(false); alert('連線失敗：' + e); });
}

function kv(pairs) {
  return '<dl class="kv">' + pairs.filter(function (p) {
    return String(p[1] || '').trim() !== '';
  }).map(function (p) {
    return '<dt>' + escapeHtml(p[0]) + '</dt><dd>' + escapeHtml(p[1]) + '</dd>';
  }).join('') + '</dl>';
}


/* ── 可編輯欄位（教師修飾學生自述文字用）──────────────── */
/* FIELD_VALUES 存原始文字（不含 HTML 跳脫），編輯/取消時從這裡讀回 */
let FIELD_VALUES = {};

function efView(value) {
  return value ? escapeHtml(value).replace(/\n/g, '<br>') : '<span class="ef-empty">（空白）</span>';
}

function ef(path, label, value) {
  FIELD_VALUES[path] = value || '';
  return '<div class="ef" data-path="' + escapeHtml(path) + '">' +
    '<div class="ef-head"><span>' + escapeHtml(label) + '</span>' +
    '<button type="button" class="btn-sm ef-edit" data-path="' + escapeHtml(path) + '">✏️ 編輯</button></div>' +
    '<div class="ef-view">' + efView(value) + '</div>' +
  '</div>';
}

function bindEditableFields() {
  const body = document.getElementById('mBody');

  body.addEventListener('click', function (e) {
    const editBtn = e.target.closest('.ef-edit');
    if (editBtn) { startEditField(editBtn.dataset.path); return; }
    const saveBtn = e.target.closest('.ef-save');
    if (saveBtn) { saveEditField(saveBtn.dataset.path); return; }
    const cancelBtn = e.target.closest('.ef-cancel');
    if (cancelBtn) { renderFieldView(cancelBtn.dataset.path); return; }
  });
}

function startEditField(path) {
  const box = document.querySelector('.ef[data-path="' + cssEscape(path) + '"]');
  if (!box) return;
  const value = FIELD_VALUES[path] || '';
  box.querySelector('.ef-view').outerHTML =
    '<div class="ef-editing">' +
      '<textarea class="ef-textarea" rows="4">' + escapeHtml(value) + '</textarea>' +
      '<div class="ef-actions">' +
        '<button type="button" class="btn-sm ok ef-save" data-path="' + escapeHtml(path) + '">💾 儲存</button>' +
        '<button type="button" class="btn-sm ef-cancel" data-path="' + escapeHtml(path) + '">取消</button>' +
      '</div>' +
    '</div>';
  const ta = box.querySelector('.ef-textarea');
  ta.focus();
  ta.setSelectionRange(ta.value.length, ta.value.length);
}

function renderFieldView(path) {
  const box = document.querySelector('.ef[data-path="' + cssEscape(path) + '"]');
  if (!box) return;
  box.querySelector('.ef-editing').outerHTML = '<div class="ef-view">' + efView(FIELD_VALUES[path]) + '</div>';
}

function saveEditField(path) {
  const box = document.querySelector('.ef[data-path="' + cssEscape(path) + '"]');
  const ta = box.querySelector('.ef-textarea');
  const btn = box.querySelector('.ef-save');
  const newValue = ta.value;

  btn.disabled = true;
  btn.textContent = '儲存中…';

  api('adminEditField', {
    token: token(), submissionId: CURRENT.submissionId, path: path, value: newValue
  })
    .then(function (res) {
      if (handleAuthFail(res)) return;
      if (!res.ok) {
        alert(res.message || '儲存失敗');
        btn.disabled = false; btn.textContent = '💾 儲存';
        return;
      }
      FIELD_VALUES[path] = newValue;
      renderFieldView(path);
      showBanner('#msgBox', res.unchanged ? '內容沒有變化。' : '已儲存修改：' + path, 'ok');
    })
    .catch(function (e) {
      alert('連線失敗：' + e);
      btn.disabled = false; btn.textContent = '💾 儲存';
    });
}

/** querySelector 用的簡易跳脫（避免 path 裡的特殊字元弄壞選擇器） */
function cssEscape(s) {
  return String(s).replace(/[^a-zA-Z0-9_\-]/g, '\\$&');
}


/* ── 修改紀錄 ─────────────────────────── */

function openEditHistory() {
  if (!CURRENT) return;
  api('adminEditHistory', { token: token(), submissionId: CURRENT.submissionId })
    .then(function (res) {
      if (handleAuthFail(res)) return;
      if (!res.ok) { alert(res.message || '載入失敗'); return; }
      if (!res.edits.length) { alert('這筆資料還沒有任何修改紀錄。'); return; }

      const text = res.edits.map(function (e) {
        return '【' + e.at.replace('T', ' ').slice(0, 16) + '】' + e.editor + ' 修改了 ' + e.path +
               '\n原文：' + (e.oldValue || '（空）') +
               '\n改為：' + (e.newValue || '（空）');
      }).join('\n\n');
      alert('修改紀錄（' + res.edits.length + ' 筆，最新在前）\n\n' + text);
    })
    .catch(function (e) { alert('連線失敗：' + e); });
}

function renderDetail(rec) {
  const m = rec.main;
  document.getElementById('mTitle').textContent =
    m.name + '（' + m.grad_year + ' 學年度 · 編號 ' +
    String(m.submission_id).substring(0, 6).toUpperCase() + '）';

  FIELD_VALUES = {};
  let html = '';

  html += '<div class="detail-sec"><h4>基本資料</h4>' + kv([
    ['班級座號', (m.class_name || '') + ' ' + (m.seat_no || '')],
    ['Email', m.email], ['手機', m.phone], ['IG/Line', m.social_id],
    ['最終落點', m.current_place], ['主要出路', m.main_path],
    ['報考群類', m.exam_group],
    ['統測總分', m.tve_total], ['班排', m.rank_pct],
    ['證照', (m.certificates || []).join('、')],
    ['公開層級', m.publish_level],
    ['願意回校分享', m.willing_share ? '是' : ''],
    ['接受提問', m.willing_qa ? '是' : '']
  ]) +
  ef('main.experiences', '競賽/專題經歷', m.experiences) +
  ef('main.activities', '幹部/社團/志工', m.activities) +
  '</div>';

  (rec.admissions || []).forEach(function (a, i) {
    html += '<div class="detail-sec"><h4>志願 ' + (i + 1) + '：' +
      escapeHtml(a.univ + ' ' + a.major) + (a.is_enrolled ? '　★最終就讀' : '') + '</h4>' +
      kv([
        ['招生管道', a.channel], ['一階', a.stage1_result],
        ['二階項目', (a.stage2_items || []).join('、')],
        ['二階成績', a.stage2_score],
        ['結果', String(a.final_result || '') + String(a.result_rank || '')],
        ['面試形式', a.itv_format], ['教授人數', a.itv_prof_count],
        ['時間', a.itv_duration_min], ['流程', a.itv_flow]
      ]);

    if ((a.interviews || []).length) {
      html += '<div style="margin-top:8px"><b style="font-size:13px">口試題目 ' +
        a.interviews.length + ' 題</b>';
      a.interviews.forEach(function (q, qi) {
        const p = 'itv.' + (i + 1) + '.' + (qi + 1) + '.';
        html += '<div class="q-card" style="margin:6px 0">' +
          '<div class="q-meta">' + (q.categories || []).map(function (c) {
            return '<span class="tag warn">' + escapeHtml(c) + '</span>';
          }).join('') + (q.difficulty ? '<span>難度 ' + escapeHtml(q.difficulty) + '</span>' : '') + '</div>' +
          ef(p + 'question', '第 ' + (qi + 1) + ' 題', q.question) +
          ef(p + 'my_answer', '當時回答', q.my_answer) +
          ef(p + 'better_answer', '回頭看該怎麼答', q.better_answer) +
          ef(p + 'tip', '給學弟妹的提醒', q.tip) +
        '</div>';
      });
      html += '</div>';
    }

    (a.practicals || []).forEach(function (p, pi) {
      const pp = 'prc.' + (i + 1) + '.' + (pi + 1) + '.';
      html += '<div class="q-card" style="margin:6px 0">' +
        '<div class="q-meta"><span class="tag">' + escapeHtml(p.subject || '術科') + '</span>' +
        (p.duration_min ? '<span>' + escapeHtml(p.duration_min) + ' 分</span>' : '') + '</div>' +
        ef(pp + 'content', '題目內容', p.content) +
        ef(pp + 'equipment', '現場提供的設備/工具', p.equipment) +
        ef(pp + 'prep_advice', '準備方式建議', p.prep_advice) +
        ((p.existingFiles || []).length ? '<div class="q-extra"><b>相片：</b>' +
          p.existingFiles.map(function (f) {
            return '<a href="' + escapeHtml(f.url) + '" target="_blank" rel="noopener">' +
                   escapeHtml(f.name) + '</a>';
          }).join('　') + '</div>' : '') +
      '</div>';
    });

    html += '</div>';
  });

  html += '<div class="detail-sec"><h4>備審與心得</h4>' + kv([
    ['備審頁數', m.portfolio_pages], ['製作工具', m.portfolio_tool],
    ['花費時數', m.portfolio_hours], ['面試問到備審', m.portfolio_asked]
  ]) +
  ef('main.portfolio_focus', '備審重點', m.portfolio_focus) +
  ef('main.reflection', '整體心得', m.reflection) +
  ef('main.advice_1', '建議 1', m.advice_1) +
  ef('main.advice_2', '建議 2', m.advice_2) +
  ef('main.advice_3', '建議 3', m.advice_3) +
  ef('main.do_earlier', '高一高二該先做什麼', m.do_earlier) +
  ef('main.regret', '最後悔沒做的事', m.regret) +
  '</div>';

  document.getElementById('mBody').innerHTML = html;
}

function doReview(status) {
  if (!CURRENT) return;
  const note = document.getElementById('mNote').value.trim();

  if (status === '退回修改' && !note) {
    alert('退回修改請填寫審核意見，學生才知道要改什麼（這段文字會寄給他）。');
    return;
  }
  if (status === '通過' &&
      !confirm('審核通過後，這位畢業生就無法再自行修改資料了。確定要通過嗎？')) {
    return;
  }

  busy(true, '儲存審核結果…');
  api('adminReview', {
    token: token(), submissionId: CURRENT.submissionId, status: status, note: note
  })
    .then(function (res) {
      busy(false);
      if (handleAuthFail(res)) return;
      if (!res.ok) { alert(res.message || '審核失敗'); return; }
      closeModal();
      showBanner('#msgBox', res.message, 'ok');
      load(true);
    })
    .catch(function (e) { busy(false); alert('連線失敗：' + e); });
}


/* ── 匯出 ─────────────────────────────── */

function doExport() {
  const sheet = document.getElementById('expSheet').value;
  const onlyApproved = document.getElementById('expApproved').checked;

  busy(true, '產生 CSV…');
  api('adminExport', { token: token(), sheet: sheet, onlyApproved: onlyApproved })
    .then(function (res) {
      busy(false);
      if (handleAuthFail(res)) return;
      if (!res.ok) { alert(res.message || '匯出失敗'); return; }

      const blob = new Blob([res.csv], { type: 'text/csv;charset=utf-8;' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = res.filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);

      showBanner('#msgBox', '已匯出 ' + res.rowCount + ' 筆到 ' + res.filename, 'ok');
    })
    .catch(function (e) { busy(false); alert('連線失敗：' + e); });
}
</script>
