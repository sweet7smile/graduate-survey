<style>
:root {
  --brand: #1a3a5c;
  --brand-light: #2c5f8a;
  --accent: #f0a202;
  --bg: #f2f5f8;
  --card: #ffffff;
  --text: #1c2733;
  --muted: #6b7a8c;
  --line: #dde4ec;
  --danger: #c0392b;
  --ok: #1e8449;
  --radius: 12px;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: "Noto Sans TC", "Microsoft JhengHei", -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 16px;
  line-height: 1.6;
  -webkit-text-size-adjust: 100%;
}

/* ── 導覽列 ───────────────────────────── */
nav.topnav {
  background: #10263e;
  border-bottom: 1px solid rgba(255,255,255,.12);
}
.nav-inner {
  max-width: 1100px; margin: 0 auto;
  padding: 8px 14px;
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px; flex-wrap: wrap;
}
.nav-links { display: flex; gap: 4px; flex-wrap: wrap; }
.nav-link {
  color: #cfe0f0; text-decoration: none;
  padding: 8px 13px; border-radius: 8px;
  font-size: 14px; font-weight: 600; white-space: nowrap;
}
.nav-link:hover { background: rgba(255,255,255,.1); color: #fff; }
.nav-link.active { background: var(--brand-light); color: #fff; }

.nav-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.nav-user { color: #9fc0dd; font-size: 13px; white-space: nowrap; }
.nav-btn {
  display: inline-block; text-decoration: none;
  padding: 7px 13px; border-radius: 8px;
  font-size: 13px; font-weight: 600; white-space: nowrap;
  border: 1px solid rgba(255,255,255,.28);
  background: transparent; color: #dce9f5; font-family: inherit;
}
.nav-btn:hover { background: rgba(255,255,255,.12); }
.nav-btn.primary { background: var(--accent); border-color: var(--accent); color: #3a2800; }
.nav-btn.primary:hover { filter: brightness(1.08); }

@media (max-width: 560px) {
  .nav-inner { padding: 7px 10px; }
  .nav-link, .nav-btn { padding: 6px 10px; font-size: 13px; }
  .nav-user { width: 100%; }
}

/* ── 蜜罐（防灌水用，見 index.html 說明）───────────────── */
.hp-trap {
  position: absolute;
  left: -9999px;
  top: -9999px;
  width: 1px;
  height: 1px;
  overflow: hidden;
}

/* ── 頁首 ─────────────────────────────── */
header.top {
  background: linear-gradient(135deg, var(--brand), var(--brand-light));
  color: #fff;
  padding: 22px 18px 18px;
}
header.top h1 { margin: 0 0 6px; font-size: 21px; letter-spacing: .5px; }
header.top p  { margin: 0; font-size: 14px; opacity: .9; }

.progress-wrap {
  position: sticky; top: 0; z-index: 50;
  background: var(--card);
  border-bottom: 1px solid var(--line);
  padding: 8px 18px;
}
.progress-bar { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
.progress-fill {
  height: 100%; width: 0%;
  background: linear-gradient(90deg, var(--brand-light), var(--accent));
  transition: width .3s ease;
}
.progress-text { font-size: 12px; color: var(--muted); margin-top: 4px; }

/* ── 版面 ─────────────────────────────── */
main { max-width: 860px; margin: 0 auto; padding: 16px 14px 120px; }

section.card {
  background: var(--card);
  border-radius: var(--radius);
  border: 1px solid var(--line);
  margin-bottom: 16px;
  overflow: hidden;
}
section.card > h2 {
  margin: 0;
  padding: 14px 16px;
  font-size: 17px;
  background: #f7f9fb;
  border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 9px;
}
section.card > h2 .num {
  background: var(--brand); color: #fff;
  width: 26px; height: 26px; border-radius: 50%;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 13px; flex: 0 0 auto;
}
.card-body { padding: 16px; }

.hint {
  font-size: 13px; color: var(--muted);
  background: #f7f9fb; border-left: 3px solid var(--brand-light);
  padding: 9px 12px; border-radius: 0 8px 8px 0; margin: 0 0 14px;
}
.hint.warn { border-left-color: var(--accent); background: #fff8e8; color: #7a5600; }

/* ── 欄位 ─────────────────────────────── */
.field { margin-bottom: 14px; }
.field > label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 5px; }
.field .sub { font-size: 12px; color: var(--muted); font-weight: 400; margin-left: 4px; }
.req::after { content: " *"; color: var(--danger); }

/* 用排除法而非逐一列舉輸入類型：先前漏掉 password 導致密碼欄套不到樣式，
   掉回瀏覽器預設寬度，跟旁邊的欄位對不齊。 */
input:not([type=checkbox]):not([type=radio]):not([type=file]),
select, textarea {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: 9px;
  font-size: 16px;           /* 16px 以下 iOS 會自動放大畫面 */
  font-family: inherit;
  background: #fff;
  color: var(--text);
}
input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: var(--brand-light);
  box-shadow: 0 0 0 3px rgba(44,95,138,.15);
}

/* 瀏覽器自動填入會蓋上黃/藍底色，跟隔壁欄位看起來不一致 */
input:-webkit-autofill,
input:-webkit-autofill:hover,
input:-webkit-autofill:focus {
  -webkit-box-shadow: 0 0 0 1000px #fff inset;
  -webkit-text-fill-color: var(--text);
  caret-color: var(--text);
}
textarea { resize: vertical; min-height: 78px; line-height: 1.6; }
input.invalid, select.invalid, textarea.invalid { border-color: var(--danger); background: #fff5f4; }

.readonly-box {
  padding: 10px 12px; background: #eef2f6; border-radius: 9px;
  color: var(--muted); font-size: 15px;
}

.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
@media (max-width: 620px) {
  .grid2, .grid3 { grid-template-columns: 1fr; }
  .grid3.keep { grid-template-columns: repeat(3, 1fr); }
}

/* ── 勾選 / 單選 ──────────────────────── */
.chk-group { display: flex; flex-wrap: wrap; gap: 8px; }
.chk-group label {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 12px; border: 1px solid var(--line); border-radius: 99px;
  background: #fff; font-size: 14px; cursor: pointer; user-select: none;
}
.chk-group label:has(input:checked) {
  border-color: var(--brand-light); background: #e8f0f7; font-weight: 600;
}
.chk-group input { width: 16px; height: 16px; accent-color: var(--brand); margin: 0; }

.radio-col label {
  display: flex; align-items: flex-start; gap: 8px;
  padding: 9px 11px; border: 1px solid var(--line); border-radius: 9px;
  margin-bottom: 7px; background: #fff; cursor: pointer; font-size: 15px;
}
.radio-col label:has(input:checked) { border-color: var(--brand-light); background: #e8f0f7; }
.radio-col input { accent-color: var(--brand); margin-top: 3px; }

/* ── 摺疊區 ───────────────────────────── */
details.fold {
  border: 1px solid var(--line); border-radius: 9px;
  margin-bottom: 14px; background: #fbfcfd;
}
details.fold > summary {
  padding: 11px 14px; cursor: pointer; font-weight: 600; font-size: 14px;
  list-style: none; display: flex; align-items: center; justify-content: space-between;
}
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary::after { content: "▾"; color: var(--muted); }
details.fold[open] > summary::after { content: "▴"; }
details.fold > div { padding: 0 14px 14px; }

/* ── 動態卡片 ─────────────────────────── */
.dyn-card {
  border: 1px solid var(--line); border-radius: var(--radius);
  margin-bottom: 14px; background: #fbfcfd; overflow: hidden;
}
.dyn-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 13px; background: #eef3f8; border-bottom: 1px solid var(--line);
}
.dyn-title { font-weight: 700; font-size: 15px; color: var(--brand); }
.dyn-body { padding: 13px; }

.sub-card {
  border: 1px dashed #c3cfdc; border-radius: 10px;
  padding: 12px; margin-bottom: 10px; background: #fff;
}
.sub-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 9px; font-weight: 600; font-size: 14px; color: var(--brand-light);
}

.sub-section-title {
  font-size: 14px; font-weight: 700; color: var(--brand);
  margin: 16px 0 8px; padding-top: 12px; border-top: 2px solid var(--line);
  display: flex; align-items: center; gap: 6px;
}

/* ── 按鈕 ─────────────────────────────── */
button { font-family: inherit; cursor: pointer; }

.btn-add {
  width: 100%; padding: 11px; font-size: 15px; font-weight: 600;
  border: 1.5px dashed var(--brand-light); border-radius: 10px;
  background: #fff; color: var(--brand-light);
}
.btn-add:hover { background: #eef3f8; }
.btn-add:disabled { opacity: .45; cursor: not-allowed; }

.btn-add.small { padding: 8px; font-size: 14px; }

.btn-del {
  border: none; background: transparent; color: var(--danger);
  font-size: 13px; padding: 4px 8px; border-radius: 6px;
}
.btn-del:hover { background: #fdecea; }

.btn-submit {
  width: 100%; padding: 16px; font-size: 18px; font-weight: 700;
  border: none; border-radius: 12px; color: #fff;
  background: linear-gradient(135deg, var(--brand), var(--brand-light));
  box-shadow: 0 4px 14px rgba(26,58,92,.28);
}
.btn-submit:disabled {
  background: #b9c4d0; box-shadow: none; cursor: not-allowed;
}

.btn-ghost {
  padding: 10px 14px; font-size: 14px; border-radius: 9px;
  border: 1px solid var(--line); background: #fff; color: var(--muted);
}

/* ── 相片 ─────────────────────────────── */
.file-drop {
  border: 1.5px dashed #c3cfdc; border-radius: 10px;
  padding: 14px; text-align: center; background: #fafbfc;
  font-size: 14px; color: var(--muted);
}
.file-drop input[type=file] { display: none; }
.file-drop .pick {
  display: inline-block; margin-top: 6px; padding: 8px 16px;
  background: var(--brand-light); color: #fff; border-radius: 8px;
  font-size: 14px; font-weight: 600;
}
.thumbs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.thumb { position: relative; width: 84px; }
.thumb img { width: 84px; height: 84px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); display: block; }
.thumb .x {
  position: absolute; top: -6px; right: -6px;
  width: 22px; height: 22px; border-radius: 50%;
  background: var(--danger); color: #fff; border: none;
  font-size: 13px; line-height: 1; display: flex; align-items: center; justify-content: center;
}
.thumb .sz { font-size: 11px; color: var(--muted); text-align: center; margin-top: 2px; }

/* ── 送出區 ───────────────────────────── */
.submit-area { padding: 4px 2px 0; }
.draft-row {
  display: flex; align-items: center; justify-content: space-between;
  gap: 10px; margin-bottom: 12px; font-size: 13px; color: var(--muted);
}

/* ── 遮罩 / 結果頁 ────────────────────── */
.overlay {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(20,30,42,.78);
  display: none; align-items: center; justify-content: center; padding: 20px;
}
.overlay.show { display: flex; }
.overlay-box {
  background: #fff; border-radius: 14px; padding: 26px 22px;
  max-width: 420px; width: 100%; text-align: center;
}
.spinner {
  width: 42px; height: 42px; margin: 0 auto 14px;
  border: 4px solid var(--line); border-top-color: var(--brand-light);
  border-radius: 50%; animation: spin 0.9s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.result-icon { font-size: 46px; line-height: 1; margin-bottom: 10px; }
.result-code {
  font-family: ui-monospace, Menlo, Consolas, monospace;
  font-size: 26px; font-weight: 700; letter-spacing: 3px; color: var(--brand);
  background: #eef3f8; padding: 10px; border-radius: 9px; margin: 12px 0;
}

.msg-box {
  padding: 12px 14px; border-radius: 9px; margin-bottom: 14px;
  font-size: 14px; display: none; white-space: pre-wrap;
}
.msg-box.err { display: block; background: #fdecea; color: var(--danger); border: 1px solid #f5c6c2; }
.msg-box.ok  { display: block; background: #eafaf1; color: var(--ok); border: 1px solid #b7e4c9; }

footer.bottom {
  text-align: center; font-size: 12px; color: var(--muted);
  padding: 20px 14px 30px;
}

/* ═══ 登入頁 ═══════════════════════════ */
.login-wrap { max-width: 440px; margin: 40px auto; padding: 0 14px; }
.tabs { display: flex; gap: 6px; margin-bottom: 16px; }
.tab {
  flex: 1; padding: 11px; text-align: center; cursor: pointer;
  border: 1px solid var(--line); border-radius: 10px; background: #fff;
  font-size: 15px; font-weight: 600; color: var(--muted); font-family: inherit;
}
.tab.active { background: var(--brand); color: #fff; border-color: var(--brand); }

/* ═══ 查詢頁 ═══════════════════════════ */
.filter-bar {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 10px; margin-bottom: 14px;
}
.stat-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.stat-chip {
  background: #fff; border: 1px solid var(--line); border-radius: 10px;
  padding: 9px 14px; font-size: 13px; color: var(--muted);
}
.stat-chip b { color: var(--brand); font-size: 19px; margin-right: 4px; }

.q-card {
  background: #fff; border: 1px solid var(--line); border-left: 4px solid var(--brand-light);
  border-radius: 10px; padding: 13px 15px; margin-bottom: 10px;
}
.q-card .q-meta {
  font-size: 12px; color: var(--muted); margin-bottom: 6px;
  display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
}
.q-card .q-text { font-size: 15px; font-weight: 600; line-height: 1.6; }
.q-card .q-extra {
  margin-top: 8px; font-size: 13px; color: #4a5a6a;
  background: #f7f9fb; padding: 8px 11px; border-radius: 7px; white-space: pre-wrap;
}
.tag {
  display: inline-block; background: #e8f0f7; color: var(--brand);
  padding: 2px 9px; border-radius: 99px; font-size: 11px; font-weight: 600;
}
.tag.gray { background: #eef1f4; color: var(--muted); }
.tag.ok { background: #eafaf1; color: var(--ok); }
.tag.warn { background: #fff8e8; color: #7a5600; }
.tag.err { background: #fdecea; color: var(--danger); }

.empty {
  text-align: center; padding: 40px 20px; color: var(--muted); font-size: 14px;
}

/* ═══ 教師後台 ═════════════════════════ */
.wide { max-width: 1100px; }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
table.data { border-collapse: collapse; width: 100%; font-size: 14px; min-width: 860px; }
table.data th, table.data td {
  padding: 9px 11px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top;
}
table.data th {
  background: #f2f6fa; font-size: 13px; color: var(--brand);
  position: sticky; top: 0; white-space: nowrap;
}
table.data tr:hover td { background: #fafcfe; }
table.data td.num { text-align: center; color: var(--muted); }

.btn-sm {
  padding: 5px 11px; font-size: 13px; border-radius: 7px;
  border: 1px solid var(--line); background: #fff; font-family: inherit;
  white-space: nowrap;
}
.btn-sm:hover { background: #eef3f8; }
.btn-sm.ok { border-color: var(--ok); color: var(--ok); }
.btn-sm.ok:hover { background: #eafaf1; }
.btn-sm.warn { border-color: var(--accent); color: #7a5600; }
.btn-sm.warn:hover { background: #fff8e8; }

.modal {
  position: fixed; inset: 0; z-index: 300; background: rgba(20,30,42,.75);
  display: none; align-items: flex-start; justify-content: center;
  padding: 24px 14px; overflow-y: auto;
}
.modal.show { display: flex; }
.modal-box {
  background: #fff; border-radius: 14px; max-width: 780px; width: 100%;
  padding: 22px; margin: auto 0;
}
.modal-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px solid var(--line);
}
.detail-sec { margin-bottom: 16px; }
.detail-sec h4 {
  margin: 0 0 7px; font-size: 14px; color: var(--brand);
  padding-bottom: 5px; border-bottom: 2px solid var(--line);
}
.kv { display: grid; grid-template-columns: 130px 1fr; gap: 5px 12px; font-size: 14px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; white-space: pre-wrap; word-break: break-word; }

/* 列表的操作欄：檢視與刪除並排，窄螢幕自動換行 */
.row-actions { display: flex; gap: 6px; flex-wrap: wrap; }

/* 刪除鈕做成線框紅字而非填色 —— 每一列都有，填色會讓整張表看起來很危險 */
.btn-sm.del-row { border-color: #f0c6c1; color: var(--danger); background: #fff; }
.btn-sm.del-row:hover { background: #fdecea; border-color: var(--danger); }

/* 刪除確認視窗 */
#delModal .modal-head { border-bottom-color: #f5ddda; }
#delModal code {
  background: #fdecea; padding: 2px 8px; border-radius: 5px;
  font-weight: 700; letter-spacing: 2px; color: var(--danger);
}
#delModal .hint.warn { line-height: 1.8; }

.btn-submit.danger {
  background: var(--danger); box-shadow: 0 4px 14px rgba(192,57,43,.28);
}
.btn-submit.danger:disabled {
  background: #b9c4d0; box-shadow: none; cursor: not-allowed;
}

/* 教師可編輯欄位（心得、建議、口試回答等自述文字） */
.ef { margin-bottom: 12px; }
.ef-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 4px;
}
.ef-head > span { font-size: 13px; color: var(--muted); font-weight: 600; }
.ef-edit { padding: 3px 9px; font-size: 12px; }
.ef-view {
  font-size: 14px; line-height: 1.6; white-space: pre-wrap; word-break: break-word;
  padding: 8px 10px; background: #fbfcfd; border: 1px solid var(--line); border-radius: 8px;
  min-height: 1.6em;
}
.ef-empty { color: var(--muted); font-style: italic; }
.ef-editing .ef-textarea {
  width: 100%; font-family: inherit; font-size: 14px; line-height: 1.6;
  padding: 8px 10px; border: 1px solid var(--brand-light); border-radius: 8px;
  resize: vertical;
}
.ef-actions { display: flex; gap: 6px; margin-top: 6px; }
</style>
